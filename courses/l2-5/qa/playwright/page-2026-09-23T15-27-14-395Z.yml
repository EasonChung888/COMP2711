              - generic [ref=f3e63]: "6"
          - text: 种搭配。这里每套搭配都同时包含“一件上衣”和“一条裤子”。
        - paragraph [ref=f3e64]:
          - strong [ref=f3e65]: Sum Rule，加法法则
          - text: ：把所有结果分成互不重叠的类别，再把各类的数量相加。例如，只买一个点心，可以从 3 种蛋糕或 2 种面包中选一个，并且这两类没有重复的选项，那么一共有
          - generic [ref=f3e66]:
