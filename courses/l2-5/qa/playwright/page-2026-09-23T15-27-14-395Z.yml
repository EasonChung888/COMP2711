          - text: 种选择。
        - paragraph [ref=f3e80]:
          - text: 判断时先问：
          - strong [ref=f3e81]: 我是在分步骤构造一个结果，还是把结果分成不同类别？
          - text: 分步骤通常对应乘法，分成互不重叠的类别通常对应加法。还要检查计数是否重复，以及每一步的选择数是否真的适用。
        - paragraph [ref=f3e82]: "“Reading: Rosen 6.1, 6.2” 是课件给出的教材阅读范围。这页没有要求记忆复杂公式；它先告诉你，本讲要建立的核心能力是把一个计数问题拆成可以相乘或相加的部分。"
