          - text: ：一个完整结果需要经过几个步骤才能形成，就逐步计算选择数，再把它们相乘。例如，选一件上衣有 3 种选择，选一条裤子有 2 种选择，而且每件上衣都能搭配这两条裤子，那么有
          - generic [ref=f3e50]:
